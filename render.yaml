services:
  - type: web
    name: zoom-videosdk-scheduling-invite
    runtime: node
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    repo: https://github.com/zoom/videosdk-scheduling-and-invite-sample
    rootDir: .
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 24.7.0
      - key: NODE_ENV
        value: production
      - key: ENDPOINT_URL
        sync: false
      - key: ZOOM_VSDK_KEY
        sync: false
      - key: ZOOM_VSDK_SECRET
        sync: false
      - key: ZOOM_API_KEY
        sync: false
      - key: ZOOM_API_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false