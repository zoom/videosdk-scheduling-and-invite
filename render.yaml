services:
  - type: web
    name: Zoom Video SDKScheduling and Invite System
    runtime: node
    buildCommand: npm install
    startCommand: npm run server
    repo:  https://github.com/zoom/zoom-rtms-sentiment-sample
    rootDir: .
    plan: free
    envVars:
      - key: ZOOM_VSDK_KEY
        sync: false
      - key: ZOOM_VSDK_SECRET
        sync: false
      - key: ZOOM_API_KEY
        sync: false
      - key: ZOOM_API_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PORT
        sync: false